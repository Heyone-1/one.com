<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reels</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #000;
      --surface: #121212;
      --surface-2: #1c1c1e;
      --border: #262626;
      --text: #fafafa;
      --muted: #a8a8a8;
      --blue: #0095f6;
      --blue-hover: #1877f2;
      --red: #ed4956;
      --green: #22c55e;
      --gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    /* ===== Top bar ===== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      z-index: 20;
      flex-shrink: 0;
    }

    .topbar .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-style: italic;
    }

    .topbar .icon-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .topbar .icon-btn svg {
      width: 26px;
      height: 26px;
      stroke: var(--text);
      stroke-width: 1.8;
      fill: none;
    }

    .topbar .icon-btn:active { opacity: 0.6; }

    /* ===== Reel Feed ===== */
    .feed {
      flex: 1;
      overflow-y: scroll;
      overflow-x: hidden;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .feed::-webkit-scrollbar { display: none; }

    .reel {
      position: relative;
      height: 100%;
      width: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .reel-bg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .reel-bg .gradient-bg {
      position: absolute;
      inset: 0;
      opacity: 0.85;
    }

    .reel-bg .reel-emoji {
      font-size: 140px;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.4));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }

    .theme-1 { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }
    .theme-2 { background: linear-gradient(135deg, #2d1b3d 0%, #4a1a5e 50%, #1a0b2e 100%); }
    .theme-3 { background: linear-gradient(135deg, #1a2e1a 0%, #0f3d1f 50%, #0b2e14 100%); }
    .theme-4 { background: linear-gradient(135deg, #3d1f1a 0%, #5e2a1a 50%, #2e140b 100%); }
    .theme-5 { background: linear-gradient(135deg, #1a2e3d 0%, #0f2a3d 50%, #0b1e2e 100%); }

    .reel-bg video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    .reel-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      z-index: 10;
      pointer-events: none;
    }

    .reel-overlay > * { pointer-events: auto; }

    .reel-actions {
      position: absolute;
      right: 8px;
      bottom: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .action-btn {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 4px;
      transition: transform 0.15s ease;
    }

    .action-btn:active { transform: scale(0.88); }

    .action-btn svg {
      width: 32px;
      height: 32px;
      stroke: white;
      stroke-width: 1.8;
      fill: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .action-btn.liked svg {
      fill: var(--red);
      stroke: var(--red);
      animation: heartPop 0.35s ease;
    }

    @keyframes heartPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.35); }
      70% { transform: scale(0.92); }
      100% { transform: scale(1); }
    }

    .action-btn .count {
      font-size: 12px;
      font-weight: 600;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }

    .reel-info {
      position: absolute;
      left: 16px;
      right: 80px;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .reel-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .reel-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: white;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.4);
    }

    .reel-username {
      font-size: 14px;
      font-weight: 600;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }

    .follow-btn {
      background: none;
      border: 1.5px solid rgba(255,255,255,0.6);
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 4px;
      transition: all 0.15s;
    }

    .follow-btn:active { background: rgba(255,255,255,0.2); }
    .follow-btn.following { border-color: rgba(255,255,255,0.3); color: var(--muted); }

    .reel-caption {
      font-size: 14px;
      color: white;
      line-height: 1.4;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .reel-music {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }

    .reel-music svg { width: 14px; height: 14px; fill: white; }

    .music-marquee { overflow: hidden; white-space: nowrap; max-width: 180px; }
    .music-marquee span { display: inline-block; animation: marquee 8s linear infinite; padding-right: 40px; }
    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    .reel-play-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      width: 64px;
      height: 64px;
      background: rgba(0,0,0,0.55);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 5;
    }

    .reel-play-hint.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .reel-play-hint svg {
      width: 32px;
      height: 32px;
      fill: white;
    }

    /* ===== Comment Sheet ===== */
    .comment-sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .comment-sheet-backdrop.open { opacity: 1; pointer-events: auto; }

    .comment-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 480px;
      margin: 0 auto;
      height: 70vh;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      z-index: 101;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
    }

    .comment-sheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: #555;
      border-radius: 2px;
      margin: 8px auto 4px;
      flex-shrink: 0;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sheet-header .title { font-size: 15px; font-weight: 600; }

    .sheet-header .close-sheet {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 22px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .comments-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .comments-list::-webkit-scrollbar { display: none; }

    .comment {
      display: flex;
      gap: 10px;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .comment-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      color: white;
      flex-shrink: 0;
    }

    .comment-body { flex: 1; min-width: 0; }
    .comment-body .username { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .comment-body .text { font-size: 14px; color: var(--text); line-height: 1.35; word-wrap: break-word; }

    .comment-body .meta {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    .comment-body .meta button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      padding: 0;
    }

    .comment-body .meta button:active { color: var(--text); }
    .comment-body .meta .liked { color: var(--red); font-weight: 600; }

    .empty-comments {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: var(--muted);
      text-align: center;
      gap: 8px;
    }

    .empty-comments .emoji { font-size: 40px; opacity: 0.6; }
    .empty-comments p { font-size: 14px; }

    .comment-input-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px 16px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surface);
    }

    .comment-input-bar .input-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      color: white;
      flex-shrink: 0;
    }

    .comment-input {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 10px 16px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    .comment-input::placeholder { color: var(--muted); }
    .comment-input:focus { border-color: #444; }

    .post-comment-btn {
      background: none;
      border: none;
      color: var(--blue);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 4px;
      flex-shrink: 0;
      opacity: 0.4;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    .post-comment-btn.active { opacity: 1; pointer-events: auto; }

    /* ===== Upload Modal ===== */
    .upload-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .upload-modal-backdrop.open { opacity: 1; pointer-events: auto; }

    .upload-modal {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      width: calc(100% - 40px);
      max-width: 400px;
      background: var(--surface);
      border-radius: 16px;
      z-index: 201;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.32, 0.72, 0, 1);
      overflow: hidden;
      border: 1px solid var(--border);
      max-height: 92vh;
      display: flex;
      flex-direction: column;
    }

    .upload-modal.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .upload-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .upload-modal-header h3 { font-size: 16px; font-weight: 600; }

    .upload-modal-header button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }

    .upload-modal-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    .upload-modal-body::-webkit-scrollbar { display: none; }

    .upload-dropzone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .upload-dropzone:active,
    .upload-dropzone.dragover {
      border-color: var(--blue);
      background: rgba(0,149,246,0.05);
    }

    .upload-dropzone .icon { font-size: 36px; display: block; margin-bottom: 8px; }
    .upload-dropzone p { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .upload-dropzone small { font-size: 12px; color: var(--muted); }

    /* ===== Video Trimmer ===== */
    .trimmer-section {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .trimmer-section.visible { display: flex; }

    .trimmer-preview {
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      position: relative;
    }

    .trimmer-preview video {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      display: block;
      background: #000;
    }

    .trimmer-time-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .trimmer-time-info .duration-ok { color: var(--green); }
    .trimmer-time-info .duration-bad { color: var(--red); }

    .trim-track-wrap {
      position: relative;
      padding: 0 0 4px;
      user-select: none;
      -webkit-user-select: none;
    }

    .trim-track {
      position: relative;
      height: 48px;
      background: var(--surface-2);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--border);
    }

    .trim-track .thumbstrip {
      position: absolute;
      inset: 0;
      display: flex;
      opacity: 0.9;
    }

    .trim-track .thumbstrip canvas {
      height: 100%;
      width: 12.5%;
      object-fit: cover;
      border-right: 1px solid rgba(0,0,0,0.3);
    }

    .trim-selection {
      position: absolute;
      top: 0;
      bottom: 0;
      background: rgba(0,149,246,0.25);
      border: 2px solid var(--blue);
      border-radius: 4px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.55);
      box-sizing: border-box;
    }

    .trim-handle {
      position: absolute;
      top: -2px;
      bottom: -2px;
      width: 16px;
      background: var(--blue);
      border-radius: 4px;
      cursor: ew-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
      touch-action: none;
    }

    .trim-handle::after {
      content: '';
      width: 2px;
      height: 16px;
      background: rgba(255,255,255,0.8);
      border-radius: 1px;
      box-shadow: 4px 0 0 rgba(255,255,255,0.8), -4px 0 0 rgba(255,255,255,0.8);
    }

    .trim-handle.left { left: 0; }
    .trim-handle.right { right: 0; }

    .trim-playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: white;
      pointer-events: none;
      z-index: 2;
      display: none;
    }

    .trim-hint {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      line-height: 1.4;
    }

    .trim-hint strong { color: var(--blue); }

    .upload-caption-input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      min-height: 56px;
      outline: none;
    }

    .upload-caption-input::placeholder { color: var(--muted); }
    .upload-caption-input:focus { border-color: #444; }

    .upload-submit-btn {
      width: 100%;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .upload-submit-btn:disabled {
      background: #1a3a5c;
      color: #6b8fb0;
      cursor: not-allowed;
    }

    .upload-submit-btn:not(:disabled):active {
      transform: scale(0.98);
      background: var(--blue-hover);
    }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #262626;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 300;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: var(--red); }

    /* ===== Bottom nav ===== */
    .bottom-nav {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 10px 0;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
      z-index: 20;
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      opacity: 0.55;
      transition: opacity 0.15s;
    }

    .nav-item.active { opacity: 1; }
    .nav-item svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 1.8; fill: none; }
    .nav-item.active svg { stroke-width: 2.2; }
    .nav-item span { font-size: 10px; font-weight: 500; }
    .nav-item:active { opacity: 0.4; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn" aria-label="Camera">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>
      <span class="logo">Reels</span>
      <button class="icon-btn" id="uploadTrigger" aria-label="Upload">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </header>

    <div class="feed" id="feed"><div style="display:flex;align-items:center;justify-content:center;height:100%;color:#a8a8a8;font-size:14px;">Loading reels...</div></div>

    <nav class="bottom-nav">
      <button class="nav-item" aria-label="Home">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>
      </button>
      <button class="nav-item" aria-label="Search">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>

      function formatCount(n) {
        n = n || 0;
        if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'K';
        return String(n);
      }

      function formatTime(sec) {
        return (Math.round(sec * 10) / 10).toFixed(1) + 's';
      }

      function escapeHtml(str) {
        var d = document.createElement('div');
        d.textContent = str || '';
        return d.innerHTML;
      }

      function timeAgo(iso) {
        if (!iso) return 'now';
        var diff = (Date.now() - new Date(iso).getTime()) / 1000;
        if (diff < 60) return 'now';
        if (diff < 3600) return Math.floor(diff / 60) + 'm';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h';
        return Math.floor(diff / 86400) + 'd';
      }

      // ===== Seed demo reels once =====
      async function seedIfEmpty() {
        if (!supabase) return;
        var result = await supabase.from('reels').select('*', { count: 'exact', head: true });

          await supabase.from('reels').insert(demos[i]);

      // ===== Load reels =====
      async function loadReels() {
        if (!supabase) {
          feed.innerHTML = '<div style="padding:40px;text-align:center;color:#fca5a5;background:#2a1215;border-radius:12px;margin:20px;">⚠️ Supabase not connected.<br><br>Check your URL and key.</div>';
          return;
        }

        await seedIfEmpty();

        var result = await supabase
          .from('reels')
          .select('*')
          .order('created_at', { ascending: false });

        if (result.error) {
          console.error('Load reels:', result.error);
          feed.innerHTML = '<div style="padding:40px;text-align:center;color:#fca5a5;background:#2a1215;border-radius:12px;margin:20px;">⚠️ Could not load reels.<br><br>' + escapeHtml(result.error.message) + '</div>';
          return;
        }

        var reels = result.data || [];
        if (reels.length === 0) {
          feed.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#a8a8a8;">No reels yet.</div>';
          return;
        }

        for (var i = 0; i < reels.length; i++) {
          var reel = reels[i];

          var likesResult = await supabase
            .from('likes')
            .select('user_id')
            .eq('reel_id', reel.id);
          reel._likes = likesResult.data || [];
          reel.liked = reel._likes.some(function(l) { return l.user_id === userId; });
          reel.likesCount = reel._likes.length;

          var commentsResult = await supabase
            .from('comments')
            .select('*')
            .eq('reel_id', reel.id)
            .order('created_at', { ascending: true });
          reel._comments = commentsResult.data || [];

          var emojiMatch = (reel.caption || '').match(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/u);
          reel.emoji = emojiMatch ? emojiMatch[0] : '🎬';
          reel.theme = 'theme-' + ((reel.id.charCodeAt(0) % 5) + 1);
        }

        allReels = reels;
        renderFeed();
      }

      // ===== Render feed =====
      function renderFeed() {
        feed.innerHTML = '';

        allReels.forEach(function(reel) {
          var el = document.createElement('div');
          el.className = 'reel';
          el.dataset.reelId = reel.id;

          var bgHtml;

            bgHtml = '<div class="reel-bg">' +

            bgHtml = '<div class="reel-bg">' +

          el.innerHTML = bgHtml +
            '<div class="reel-overlay">' +

                  '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>' +

                  '<span class="count comment-count">' + formatCount(reel._comments.length) + '</span>' +

      function setupVideoPlayback() {
        var videos = feed.querySelectorAll('.reel-bg video');
        videos.forEach(function(video) {
          var reelEl = video.closest('.reel');
          var hint = reelEl.querySelector('.reel-play-hint');

          reelEl.addEventListener('click', function(e) {
            if (e.target.closest('button')) return;
            if (video.paused) {
              video.play().catch(function() {});
              if (hint) hint.classList.remove('show');
            } else {
              video.pause();
              if (hint) {
                hint.classList.add('show');
                setTimeout(function() { hint.classList.remove('show'); }, 600);
              }
            }
          });
        });

        if ('IntersectionObserver' in window) {
          var observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
              var video = entry.target;
              if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
                video.play().catch(function() {});
              } else {
                video.pause();
              }
            });
          }, { threshold: [0, 0.6, 1] });
          videos.forEach(function(v) { observer.observe(v); });
        } else if (videos[0]) {
          videos[0].play().catch(function() {});
        }
      }

      function attachFeedEvents() {
        feed.onclick = async function(e) {
          var btn = e.target.closest('[data-action]');
          if (!btn) return;
          e.stopPropagation();
          e.preventDefault();

          var action = btn.dataset.action;
          var id = btn.dataset.id;
          var reel = allReels.find(function(r) { return String(r.id) === String(id); });
          if (!reel) return;

          if (action === 'like') {
            await toggleLike(reel, btn);
          } else if (action === 'comment') {
            openComments(reel);
          } else if (action === 'share') {
            showToast('Link copied');
          }
        };
      }

      // ===== Like toggle =====
      async function toggleLike(reel, btn) {
        if (!supabase) return;

        if (reel.liked) {
          var delResult = await supabase
            .from('likes')
            .delete()
            .eq('reel_id', reel.id)
            .eq('user_id', userId);
          if (delResult.error) { console.error(delResult.error); showToast('Could not unlike', true); return; }
          reel.liked = false;
          reel.likesCount = Math.max(0, reel.likesCount - 1);
        } else {
          var insResult = await supabase
            .from('likes')
            .insert({ reel_id: reel.id, user_id: userId });
          if (insResult.error) { console.error(insResult.error); showToast('Could not like', true); return; }
          reel.liked = true;
          reel.likesCount += 1;
          showToast('Liked');
        }

        btn.classList.toggle('liked', reel.liked);
        btn.querySelector('.like-count').textContent = formatCount(reel.likesCount);
      }

      // ===== Comments =====
      async function openComments(reel) {
        activeReel = reel;

      async function refreshComments(reel) {
        if (!supabase) return;
        var result = await supabase
          .from('comments')
          .select('*')
          .eq('reel_id', reel.id)
          .order('created_at', { ascending: true });
        if (result.error) { console.error(result.error); return; }
        reel._comments = result.data || [];
        renderComments(reel);

      function renderComments(reel) {
        commentsList.innerHTML = '';

        if (reel._comments.length === 0) {
          commentsList.innerHTML = '<div class="empty-comments">' +
            '<span class="emoji">💬</span>' +
            '<p>No comments yet</p>' +
            '<p style="font-size:12px;opacity:0.7">Start the conversation.</p>' +

          return;
        }

        var palette = ['#f09433', '#e6683c', '#dc2743', '#cc2366', '#bc1888', '#0095f6', '#22c55e', '#8b5cf6'];

        reel._comments.forEach(function(c) {
          var el = document.createElement('div');
          el.className = 'comment';
          var color = palette[(c.username || 'U').charCodeAt(0) % palette.length];

          el.innerHTML = '<div class="comment-avatar" style="background:' + color + '">' + escapeHtml(c.avatar || 'U') + '</div>' +
            '<div class="comment-body">' +
              '<div class="username">' + escapeHtml(c.username) + '</div>' +

                '<span>' + timeAgo(c.created_at) + '</span>' +

            '</div>';

        commentsList.scrollTop = commentsList.scrollHeight;

      function updatePostCommentBtn() {
        var hasText = commentInput.value.trim().length > 0;
        postCommentBtn.classList.toggle('active', hasText && !!activeReel);

      async function postComment() {
        var text = commentInput.value.trim();
        if (!text || !activeReel || !supabase) return;

        var result = await supabase.from('comments').insert({
          reel_id: activeReel.id,
          username: myUsername,
          avatar: myUsername.charAt(0).toUpperCase(),
          text: text

        if (result.error) { console.error(result.error); showToast('Could not post comment', true); return; }

        commentInput.value = '';
        updatePostCommentBtn();
        await refreshComments(activeReel);

        var reelEl = feed.querySelector('.reel[data-reel-id="' + activeReel.id + '"]');
        if (reelEl) {
          var countEl = reelEl.querySelector('.comment-count');
          if (countEl) countEl.textContent = formatCount(activeReel._comments.length);
        }

        showToast('Comment posted');
      }

      // ===== Upload & Trim =====
      function openUpload() {
        uploadBackdrop.classList.add('open');
        uploadModal.classList.add('open');

      function closeUploadModal() {
        uploadBackdrop.classList.remove('open');
        uploadModal.classList.remove('open');

      function resetUpload() {
        try { trimVideoPreview.pause(); } catch (e) {}
        if (uploadObjectUrl) { URL.revokeObjectURL(uploadObjectUrl); uploadObjectUrl = null; }
        uploadFile = null;
        videoDuration = 0;
        trimStart = 0;
        trimEnd = 0;
        uploadFileInput.value = '';
        uploadDropzone.style.display = 'block';
        trimmerSection.classList.remove('visible');
        trimVideoPreview.removeAttribute('src');
        trimVideoPreview.load();
        uploadCaption.value = '';
        uploadSubmitBtn.disabled = true;
        uploadSubmitBtn.textContent = 'Share reel';
        trimPlayhead.style.display = 'none';
        thumbstrip.innerHTML = '';
        trimStartLabel.textContent = '0.0s';
        trimEndLabel.textContent = '0.0s';
        trimDurationLabel.textContent = '0.0s';
        trimDurationLabel.className = '';
      }

      async function handleUploadFile(file) {
        if (!file) return;
        if (!file.type.startsWith('video/')) {
          showToast('Please select a video file', true);
          return;
        }

        if (uploadObjectUrl) URL.revokeObjectURL(uploadObjectUrl);

        uploadFile = file;
        uploadObjectUrl = URL.createObjectURL(file);
        uploadSubmitBtn.disabled = true;

        uploadDropzone.style.display = 'none';
        trimmerSection.classList.add('visible');

        trimVideoPreview.src = uploadObjectUrl;
        trimVideoPreview.load();

        trimDurationLabel.textContent = 'Loading...';
        trimDurationLabel.className = '';

        trimVideoPreview.onloadedmetadata = async function() {
          if (!isFinite(trimVideoPreview.duration) || trimVideoPreview.duration <= 0) {
            trimVideoPreview.currentTime = 1e101;
            await new Promise(function(resolve) {
              trimVideoPreview.ontimeupdate = function() {
                trimVideoPreview.ontimeupdate = null;
                trimVideoPreview.currentTime = 0;
                resolve();
              };
            });
          }

          videoDuration = trimVideoPreview.duration;
          if (!isFinite(videoDuration) || videoDuration <= 0) {
            showToast('Could not read video duration', true);
            return;
          }

          if (videoDuration <= MAX_DURATION) {
            trimStart = 0;
            trimEnd = videoDuration;
          } else {
            trimStart = 0;
            trimEnd = MAX_DURATION;
          }

          await generateThumbnails();

          updateTrimUI();
          trimVideoPreview.currentTime = trimStart;
          uploadSubmitBtn.disabled = false;
        };

        trimVideoPreview.onerror = function() {
          showToast('Could not load this video', true);
          resetUpload();
        };
      }

      async function generateThumbnails() {
        thumbstrip.innerHTML = '';
        var count = 8;
        var step = videoDuration / count;

        for (var i = 0; i < count; i++) {
          var canvas = document.createElement('canvas');
          canvas.width = 80;
          canvas.height = 48;
          thumbstrip.appendChild(canvas);

          var t = Math.min(i * step + step / 2, videoDuration - 0.05);
          try {
            await seekVideo(t);
            var ctx = canvas.getContext('2d');
            var vw = trimVideoPreview.videoWidth;
            var vh = trimVideoPreview.videoHeight;
            if (vw && vh) {
              var scale = Math.max(80 / vw, 48 / vh);
              var dw = vw * scale;
              var dh = vh * scale;
              ctx.drawImage(trimVideoPreview, (80 - dw) / 2, (48 - dh) / 2, dw, dh);
            } else {
              ctx.fillStyle = '#1c1c1e';
              ctx.fillRect(0, 0, 80, 48);
            }
          } catch (e) {
            var c2 = canvas.getContext('2d');
            c2.fillStyle = '#1c1c1e';
            c2.fillRect(0, 0, 80, 48);
          }
        }

        trimVideoPreview.currentTime = trimStart;
      }

      function seekVideo(time) {
        return new Promise(function(resolve) {
          var onSeeked = function() {
            trimVideoPreview.removeEventListener('seeked', onSeeked);
            resolve();
          };
          trimVideoPreview.addEventListener('seeked', onSeeked);
          try { trimVideoPreview.currentTime = time; } catch (e) { resolve(); }
        });
      }

      function updateTrimUI() {
        if (!videoDuration) return;
        var trackRect = trimTrack.getBoundingClientRect();
        if (!trackRect.width) return;

        var startPct = (trimStart / videoDuration) * 100;
        var endPct = (trimEnd / videoDuration) * 100;

        trimSelection.style.left = startPct + '%';
        trimSelection.style.width = (endPct - startPct) + '%';
        handleLeft.style.left = 'calc(' + startPct + '% - 8px)';
        handleRight.style.left = 'calc(' + endPct + '% - 8px)';

        var dur = trimEnd - trimStart;
        trimStartLabel.textContent = formatTime(trimStart);
        trimEndLabel.textContent = formatTime(trimEnd);
        trimDurationLabel.textContent = formatTime(dur) + ' selected';

        if (dur <= MAX_DURATION) {
          trimDurationLabel.className = 'duration-ok';
          uploadSubmitBtn.disabled = false;
        } else {
          trimDurationLabel.className = 'duration-bad';
          uploadSubmitBtn.disabled = true;
        }

        updatePlayhead();
      }

      function updatePlayhead() {
        if (!videoDuration) return;
        var pct = (trimVideoPreview.currentTime / videoDuration) * 100;
        trimPlayhead.style.left = pct + '%';
        trimPlayhead.style.display = 'block';
      }

      function getTimeFromEvent(e) {
        var rect = trimTrack.getBoundingClientRect();
        var clientX = e.touches ? e.touches[0].clientX : e.clientX;
        var pct = (clientX - rect.left) / rect.width;
        pct = Math.max(0, Math.min(1, pct));
        return pct * videoDuration;
      }

      function startDrag(type, e) {
        e.preventDefault();
        e.stopPropagation();
        isDragging = type;
        trimVideoPreview.pause();
        if (type === 'left' || type === 'right') document.body.style.cursor = 'ew-resize';
      }

      function onDragMove(e) {
        if (!isDragging || !videoDuration) return;
        e.preventDefault();
        var time = getTimeFromEvent(e);
        if (isDragging === 'left') {
          trimStart = Math.min(Math.max(0, time), trimEnd - 0.1);
          trimVideoPreview.currentTime = trimStart;
        } else if (isDragging === 'right') {
          trimEnd = Math.max(Math.min(videoDuration, time), trimStart + 0.1);
          trimVideoPreview.currentTime = Math.max(trimStart, trimEnd - 0.1);
        }
        updateTrimUI();
      }

      function endDrag() {
        if (isDragging && (isDragging === 'left' || isDragging === 'right')) {
          var dur = trimEnd - trimStart;
          if (dur > MAX_DURATION) showToast('Clip is ' + formatTime(dur) + ' — trim to under 60s', true);
        }
        isDragging = null;
        document.body.style.cursor = '';
        trimVideoPreview.currentTime = trimStart;
        updatePlayhead();
      }

      handleLeft.addEventListener('mousedown', function(e) { startDrag('left', e); });
      handleRight.addEventListener('mousedown', function(e) { startDrag('right', e); });
      handleLeft.addEventListener('touchstart', function(e) { startDrag('left', e); }, { passive: false });
      handleRight.addEventListener('touchstart', function(e) { startDrag('right', e); }, { passive: false });

      trimTrack.addEventListener('mousedown', function(e) {
        var time = getTimeFromEvent(e);
        if (time >= trimStart && time <= trimEnd) {
          trimVideoPreview.currentTime = time;
          updatePlayhead();
        }
      });
      trimTrack.addEventListener('click', function(e) {
        var time = getTimeFromEvent(e);
        if (time >= trimStart && time <= trimEnd) {
          trimVideoPreview.currentTime = time;
          updatePlayhead();
        }
      });

      document.addEventListener('mousemove', onDragMove);
      document.addEventListener('touchmove', onDragMove, { passive: false });
      document.addEventListener('mouseup', endDrag);
      document.addEventListener('touchend', endDrag);

      trimVideoPreview.addEventListener('timeupdate', function() {
        if (!isDragging) updatePlayhead();
      });

      // ===== Trim to blob =====
      async function trimVideoToBlob(sourceUrl, startTime, endTime) {
        return new Promise(async function(resolve, reject) {
          try {
            var video = document.createElement('video');
            video.src = sourceUrl;
            video.muted = true;
            video.playsInline = true;

            await new Promise(function(res, rej) {
              video.onloadedmetadata = res;
              video.onerror = rej;
            });

            var mimeType = '';
            var candidates = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
            for (var i = 0; i < candidates.length; i++) {
              if (MediaRecorder.isTypeSupported(candidates[i])) { mimeType = candidates[i]; break; }
            }
            if (!mimeType) { reject(new Error('No supported recorder mime type')); return; }

            var canvas = document.createElement('canvas');
            var vw = video.videoWidth || 720;
            var vh = video.videoHeight || 1280;
            var maxDim = 720;
            var cw = vw, ch = vh;
            if (Math.max(vw, vh) > maxDim) {
              var scale = maxDim / Math.max(vw, vh);
              cw = Math.round(vw * scale);
              ch = Math.round(vh * scale);
            }
            canvas.width = cw;
            canvas.height = ch;
            var ctx = canvas.getContext('2d');

            var stream = canvas.captureStream(30);
            var audioTracks = [];
            try {
              if (typeof video.captureStream === 'function') {
                var vs = video.captureStream();
                audioTracks = vs.getAudioTracks();
              } else if (typeof video.mozCaptureStream === 'function') {
                var vs2 = video.mozCaptureStream();
                audioTracks = vs2.getAudioTracks();
              }
            } catch (e) {}
            audioTracks.forEach(function(t) { stream.addTrack(t); });

            var recorder = new MediaRecorder(stream, { mimeType: mimeType, videoBitsPerSecond: 2500000 });
            var chunks = [];
            recorder.ondataavailable = function(e) { if (e.data && e.data.size > 0) chunks.push(e.data); };
            var finish = function() { if (recorder.state !== 'inactive') recorder.stop(); };
            recorder.onstop = function() {
              var blob = new Blob(chunks, { type: mimeType });
              video.pause();
              video.removeAttribute('src');
              video.load();
              resolve(blob);
            };
            recorder.onerror = function(e) { reject(e.error || new Error('Recording failed')); };

            video.currentTime = startTime;
            await new Promise(function(res) {
              var onSeeked = function() {
                video.removeEventListener('seeked', onSeeked);
                res();
              };
              video.addEventListener('seeked', onSeeked);
            });

            recorder.start();
            await video.play();

            function drawLoop() {
              if (video.currentTime >= endTime || video.ended) {
                try { ctx.drawImage(video, 0, 0, cw, ch); } catch (e) {}
                finish();
                return;
              }
              try { ctx.drawImage(video, 0, 0, cw, ch); } catch (e) {}
              requestAnimationFrame(drawLoop);
            }
            requestAnimationFrame(drawLoop);

            setTimeout(function() {
              if (recorder.state !== 'inactive') finish();
            }, Math.max(3000, (endTime - startTime) * 1000 + 3000));

          } catch (err) {
            reject(err);
          }
        });
      }

      function capturePoster(sourceUrl, time) {
        return new Promise(function(resolve) {
          var video = document.createElement('video');
          video.src = sourceUrl;
          video.muted = true;
          video.playsInline = true;

          video.onloadedmetadata = function() {
            video.currentTime = Math.min(time, video.duration - 0.05);
          };

          video.onseeked = function() {
            var canvas = document.createElement('canvas');
            var vw = video.videoWidth || 720;
            var vh = video.videoHeight || 1280;
            var maxDim = 480;
            var cw = vw, ch = vh;
            if (Math.max(vw, vh) > maxDim) {
              var scale = maxDim / Math.max(vw, vh);
              cw = Math.round(vw * scale);
              ch = Math.round(vh * scale);
            }
            canvas.width = cw;
            canvas.height = ch;
            var ctx = canvas.getContext('2d');
            try {
              ctx.drawImage(video, 0, 0, cw, ch);
              var data = canvas.toDataURL('image/jpeg', 0.85);
              video.removeAttribute('src');
              video.load();
              resolve(data);
            } catch (e) {
              video.removeAttribute('src');
              video.load();
              resolve('');
            }
          };

          video.onerror = function() { resolve(''); };
        });
      }

      // ===== Submit upload =====
      async function submitUpload() {
        if (!uploadFile) { showToast('No video selected', true); return; }

        var selectedDuration = trimEnd - trimStart;
        if (selectedDuration > MAX_DURATION) { showToast('Trim to under 60 seconds to publish', true); return; }
        if (selectedDuration <= 0.1) { showToast('Selection too short', true); return; }

        uploadSubmitBtn.disabled = true;
        uploadSubmitBtn.textContent = 'Processing...';
        showToast('Trimming your reel...');

        try {
          var trimmedBlob = await trimVideoToBlob(uploadObjectUrl, trimStart, trimEnd);
          var posterData = await capturePoster(uploadObjectUrl, trimStart);

          var caption = uploadCaption.value.trim() || 'New reel 🎬';

          // Save reel row to Supabase
          var insResult = await supabase.from('reels').insert({
            username: myUsername,
            avatar: myUsername.charAt(0).toUpperCase(),
            caption: caption,
            video_url: null,
            poster: posterData
          }).select().single();

          if (insResult.error) {
            console.error(insResult.error);
            showToast('Could not publish reel', true);
            uploadSubmitBtn.disabled = false;
            uploadSubmitBtn.textContent = 'Share reel';
            return;
          }

          showToast('Reel published! 🎬');
          closeUploadModal();
          await loadReels();
          feed.scrollTop = 0;
        } catch (err) {
          console.error(err);
          showToast('Could not process video. Try another file.', true);
          uploadSubmitBtn.disabled = false;
          uploadSubmitBtn.textContent = 'Share reel';
        }
      }

      // ===== Bind events =====
      commentBackdrop.addEventListener('click', closeComments);
      closeSheet.addEventListener('click', closeComments);
      commentInput.addEventListener('input', updatePostCommentBtn);
      commentInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          postComment();
        }
      });
      postCommentBtn.addEventListener('click', postComment);

      uploadTrigger.addEventListener('click', openUpload);
      uploadBackdrop.addEventListener('click', closeUploadModal);
      closeUpload.addEventListener('click', closeUploadModal);

      uploadDropzone.addEventListener('click', function() { uploadFileInput.click(); });
      uploadFileInput.addEventListener('change', function(e) {
        if (e.target.files && e.target.files[0]) handleUploadFile(e.target.files[0]);
        uploadFileInput.value = '';
      });

      ['dragover', 'dragenter'].forEach(function(ev) {
        uploadDropzone.addEventListener(ev, function(e) {
          e.preventDefault();
          uploadDropzone.classList.add('dragover');
        });
      });
      ['dragleave', 'drop'].forEach(function(ev) {
        uploadDropzone.addEventListener(ev, function(e) {
          e.preventDefault();
          uploadDropzone.classList.remove('dragover');
        });
      });
      uploadDropzone.addEventListener('drop', function(e) {
        e.preventDefault();
        if (e.dataTransfer.files && e.dataTransfer.files[0]) handleUploadFile(e.dataTransfer.files[0]);
      });

      uploadSubmitBtn.addEventListener('click', submitUpload);

      window.addEventListener('resize', function() {
        if (videoDuration) updateTrimUI();
      });

      // ===== Init =====
      loadReels();
    })();
  </script>
